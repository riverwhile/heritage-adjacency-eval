name: Validate public reproducibility materials

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/analysis/validate_public_release.py
      - run: python scripts/analysis/analyse_protocol_attenuation.py --output-dir artifacts
      - run: python scripts/analysis/analyse_count_matched_control.py --output-dir artifacts
      - run: python scripts/analysis/aggregate_nerfacto_v2v3.py --output-dir artifacts
      - run: python scripts/analysis/build_blocked_protocol_results.py --output-dir artifacts
